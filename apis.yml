aid: createra
name: Createra
description: 'Createra is a user-generated-content (UGC) gaming metaverse platform
  backed by Andreessen Horowitz, built by the Code Infinity team associated with the
  youth-coding company Codemao. The platform lets creators build and publish infinitely
  engaging 3D worlds and games directly in the browser, founded on the belief that
  creativity is a talent that everyone possesses. Its Box3 creation platform published
  a first-party JavaScript web SDK to npm as @box3/web-sdk. As of a July 2026 probe
  the createra.fun website returns no response over HTTP or HTTPS, no developer portal,
  documentation, API reference, OpenAPI definition, or /.well-known discovery surface
  could be located, and the npm SDK has not been republished since January 2023 —
  this profile therefore records Createra as a dormant company with no active public
  API surface.'
